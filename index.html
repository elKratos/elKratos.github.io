<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Índice de personajes</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #f3ead8;
            background: #17191d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(ellipse at 50% -20%, #41404a 0, transparent 55%),
                #17191d;
        }

        h1 {
            margin: 0;
            padding: 48px 20px 12px;
            color: #f6d88c;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2rem, 5vw, 3.25rem);
            font-weight: 600;
            letter-spacing: 0.04em;
            text-align: center;
            text-shadow: 0 3px 18px #0008;
        }

        #message {
            min-height: 1.5em;
            margin: 0;
            padding: 8px 20px;
            color: #d3c7b1;
            text-align: center;
        }

        #message:empty {
            display: none;
        }

        .index {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr));
            gap: 22px;
            width: min(1200px, calc(100% - 40px));
            margin: 28px auto 56px;
        }

        .card {
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding: 16px;
            overflow: hidden;
            border: 1px solid #ffffff1c;
            border-radius: 16px;
            background: linear-gradient(155deg, #292b31, #202126 70%);
            box-shadow: 0 12px 30px #0004;
            transition: border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #d9b66d99;
            box-shadow: 0 18px 38px #0007;
        }

        .card-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            min-height: 76px;
        }

        .name {
            font-weight: bold;
            color: #f5e8ce;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.4rem;
        }

        .role {
            padding: 4px 9px;
            border: 1px solid #d9b66d45;
            border-radius: 999px;
            background: #d9b66d16;
            color: #e4c77f;
            font-size: 0.78rem;
            letter-spacing: 0.03em;
        }

        .card-body {
            margin-top: 14px;
        }

        .image {
            overflow: hidden;
            border: 1px solid #ffffff1c;
            border-radius: 11px;
            background: #eeece7;
        }

        .image img {
            display: block;
            width: 100%;
            height: 310px;
            object-fit: contain;
            transition: transform 220ms ease;
        }

        .card:hover .image img {
            transform: scale(1.025);
        }

        .description {
            margin-top: 14px;
            color: #d4d0c8;
            font-size: 0.94rem;
            line-height: 1.55;
        }

        .relation,
        .location {
            margin-top: 7px;
            color: #c1bdba;
            line-height: 1.4;
        }

        .card-footer {
            margin-top: auto;
            padding-top: 14px;
            color: #b7b0a5;
            font-size: 0.84rem;
        }

        @media (max-width: 520px) {
            h1 {
                padding-top: 32px;
            }

            .index {
                width: calc(100% - 28px);
                gap: 16px;
                margin-top: 18px;
            }

            .card {
                padding: 14px;
            }

            .image img {
                height: 280px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <h1>Índice de personajes</h1>
    <p id="message" role="status" aria-live="polite">Cargando personajes...</p>
    <main class="index" id="profiles"></main>

    <script>
        const container = document.getElementById('profiles');
        const message = document.getElementById('message');

        function createTextElement(className, text) {
            const element = document.createElement('div');
            element.className = className;
            element.textContent = text;
            return element;
        }

        function createCard(profile) {
            const card = document.createElement('article');
            card.className = 'card';

            const header = document.createElement('header');
            header.className = 'card-header';
            header.append(
                createTextElement('name', profile.name),
                createTextElement('role', profile.role)
            );

            const body = document.createElement('div');
            body.className = 'card-body';

            const imageContainer = document.createElement('div');
            imageContainer.className = 'image';
            const image = document.createElement('img');
            image.src = profile.image;
            image.alt = profile.name;
            imageContainer.append(image);
            body.append(imageContainer, createTextElement('description', profile.description));

            const footer = document.createElement('footer');
            footer.className = 'card-footer';
            footer.append(
                createTextElement('relation', `Relación: ${profile.relation}`),
                createTextElement('location', `Localización: ${profile.location}`)
            );

            card.append(header, body, footer);
            return card;
        }

        async function loadProfiles() {
            try {
                const response = await fetch('profiles.json');
                if (!response.ok) {
                    throw new Error(`Error HTTP ${response.status}`);
                }

                const data = await response.json();
                if (!Array.isArray(data.profiles)) {
                    throw new Error('El archivo profiles.json no contiene una lista de perfiles válida.');
                }

                const visibleProfiles = data.profiles.filter(profile => profile.visible === true);
                container.replaceChildren(...visibleProfiles.map(createCard));
                message.textContent = visibleProfiles.length
                    ? ''
                    : data.profiles.length
                        ? 'No hay personajes visibles.'
                        : 'No hay personajes registrados.';
            } catch (error) {
                message.textContent = `No se pudieron cargar los personajes: ${error.message}`;
            }
        }

        loadProfiles();
    </script>
</body>

</html>
